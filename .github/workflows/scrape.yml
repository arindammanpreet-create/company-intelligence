name: Intelligence Scraper + NLP

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Run scraper
      run: python scraper.py
      
    - name: Commit and push results
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add intelligence_data.json
        git diff --staged --quiet || git commit -m "Update intelligence data - $(date -u +%Y-%m-%d_%H:%M) UTC"
        git push
