name: Intelligence Scraper + NLP

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run scraper
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python scraper.py

      - name: Upload data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-data
          path: intelligence_data.json
          retention-days: 90

      - name: Commit and push via API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add intelligence_data.json
          git diff --staged --quiet || git commit -m "Update intelligence data"
          git push origin HEAD:main || echo "Push failed, but artifact is available"
